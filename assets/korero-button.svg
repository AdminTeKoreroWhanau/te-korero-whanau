<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8935a"/>
      <stop offset="40%" stop-color="#a8834e"/>
      <stop offset="100%" stop-color="#8c6d3f"/>
    </linearGradient>
    <linearGradient id="bg-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4cfc5"/>
      <stop offset="60%" stop-color="#c5bfb2"/>
      <stop offset="100%" stop-color="#b8ac98"/>
    </linearGradient>
    <radialGradient id="window-light" cx="75%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#f0ede6" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ddd8cc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c5bfb2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f5e6c8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f5e6c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lens-outer" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="80%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#111"/>
    </radialGradient>
    <radialGradient id="lens-glass" cx="40%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#2a3540"/>
      <stop offset="50%" stop-color="#111820"/>
      <stop offset="100%" stop-color="#0a0e12"/>
    </radialGradient>
    <radialGradient id="lens-reflect" cx="35%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="page-left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0e8d0"/>
      <stop offset="100%" stop-color="#f5edd8"/>
    </linearGradient>
    <linearGradient id="page-right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#faf4e2"/>
      <stop offset="100%" stop-color="#f5edd5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    <pattern id="wood-grain" x="0" y="0" width="800" height="20" patternUnits="userSpaceOnUse">
      <rect width="800" height="20" fill="transparent"/>
      <line x1="0" y1="3" x2="800" y2="4" stroke="#9e7a45" stroke-width="0.5" opacity="0.3"/>
      <line x1="0" y1="10" x2="800" y2="9" stroke="#a58248" stroke-width="0.4" opacity="0.2"/>
      <line x1="0" y1="17" x2="800" y2="18" stroke="#9e7a45" stroke-width="0.3" opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background wall -->
  <rect width="800" height="300" fill="url(#bg-wall)"/>
  <rect width="800" height="300" fill="url(#window-light)"/>
  <!-- Blurred chair in background -->
  <rect x="80" y="60" width="120" height="200" rx="20" fill="#8a8580" opacity="0.2"/>
  <rect x="90" y="30" width="100" height="50" rx="10" fill="#8a8580" opacity="0.15"/>

  <!-- Wooden desk -->
  <rect y="260" width="800" height="300" fill="url(#desk)"/>
  <rect y="260" width="800" height="300" fill="url(#wood-grain)"/>
  <line x1="0" y1="262" x2="800" y2="262" stroke="#c9a86a" stroke-width="2" opacity="0.4"/>

  <!-- Warm ambient overlay -->
  <rect width="800" height="560" fill="url(#warm-glow)"/>

  <!-- Background papers -->
  <g opacity="0.4">
    <rect x="60" y="275" width="140" height="100" rx="2" fill="#e8e2d8" transform="rotate(-5, 130, 325)"/>
    <rect x="80" y="280" width="130" height="95" rx="2" fill="#f0ebe2" transform="rotate(-2, 145, 327)"/>
  </g>
  <rect x="580" y="270" width="90" height="60" rx="3" fill="#c9a860" opacity="0.3" transform="rotate(3, 625, 300)"/>

  <!-- Video camera -->
  <g transform="translate(340, 80)" filter="url(#shadow)">
    <rect x="0" y="60" width="200" height="130" rx="10" fill="#1a1a1a"/>
    <rect x="2" y="62" width="196" height="126" rx="9" fill="#222"/>
    <g opacity="0.15" stroke="#444" stroke-width="0.5">
      <line x1="10" y1="75" x2="190" y2="75"/>
      <line x1="10" y1="175" x2="190" y2="175"/>
    </g>
    <rect x="40" y="42" width="120" height="22" rx="5" fill="#1e1e1e"/>
    <rect x="50" y="38" width="100" height="10" rx="4" fill="#252525"/>
    <!-- Shotgun mic -->
    <rect x="25" y="20" width="150" height="18" rx="9" fill="#2a2a2a" stroke="#333" stroke-width="0.5"/>
    <g opacity="0.3">
      <line x1="35" y1="24" x2="35" y2="34" stroke="#444" stroke-width="0.5"/>
      <line x1="45" y1="24" x2="45" y2="34" stroke="#444" stroke-width="0.5"/>
      <line x1="55" y1="24" x2="55" y2="34" stroke="#444" stroke-width="0.5"/>
      <line x1="65" y1="24" x2="65" y2="34" stroke="#444" stroke-width="0.5"/>
      <line x1="75" y1="24" x2="75" y2="34" stroke="#444" stroke-width="0.5"/>
      <line x1="85" y1="24" x2="85" y2="34" stroke="#444" stroke-width="0.5"/>
      <line x1="95" y1="24" x2="95" y2="34" stroke="#444" stroke-width="0.5"/>
      <line x1="105" y1="24" x2="105" y2="34" stroke="#444" stroke-width="0.5"/>
      <line x1="115" y1="24" x2="115" y2="34" stroke="#444" stroke-width="0.5"/>
      <line x1="125" y1="24" x2="125" y2="34" stroke="#444" stroke-width="0.5"/>
      <line x1="135" y1="24" x2="135" y2="34" stroke="#444" stroke-width="0.5"/>
      <line x1="145" y1="24" x2="145" y2="34" stroke="#444" stroke-width="0.5"/>
      <line x1="155" y1="24" x2="155" y2="34" stroke="#444" stroke-width="0.5"/>
    </g>
    <rect x="15" y="22" width="16" height="14" rx="3" fill="#1a1a1a"/>
    <rect x="8" y="18" width="12" height="22" rx="4" fill="#252525"/>
    <!-- Lens -->
    <rect x="30" y="82" width="90" height="78" rx="6" fill="#111" stroke="#222" stroke-width="1"/>
    <circle cx="75" cy="125" r="40" fill="url(#lens-outer)"/>
    <circle cx="75" cy="125" r="38" fill="none" stroke="#444" stroke-width="0.5"/>
    <circle cx="75" cy="125" r="33" fill="none" stroke="#333" stroke-width="0.5"/>
    <circle cx="75" cy="125" r="30" fill="url(#lens-glass)"/>
    <circle cx="75" cy="125" r="30" fill="url(#lens-reflect)"/>
    <circle cx="75" cy="125" r="22" fill="none" stroke="#1a2530" stroke-width="1" opacity="0.5"/>
    <circle cx="75" cy="125" r="15" fill="#0a1018" opacity="0.6"/>
    <ellipse cx="65" cy="115" rx="10" ry="6" fill="#fff" opacity="0.08" transform="rotate(-25,65,115)"/>
    <ellipse cx="82" cy="132" rx="5" ry="3" fill="#c8dde8" opacity="0.06" transform="rotate(20,82,132)"/>
    <g opacity="0.4" fill="#888" font-size="5" font-family="monospace">
      <text x="125" y="115">18</text>
      <text x="125" y="130">55</text>
    </g>
    <!-- Viewfinder -->
    <rect x="200" y="70" width="45" height="35" rx="4" fill="#1a1a1a" stroke="#222" stroke-width="0.5"/>
    <rect x="205" y="75" width="35" height="25" rx="3" fill="#0e0e0e"/>
    <circle cx="215" cy="120" r="4" fill="#1e1e1e" stroke="#333" stroke-width="0.5"/>
    <circle cx="215" cy="135" r="4" fill="#1e1e1e" stroke="#333" stroke-width="0.5"/>
    <rect x="205" y="150" width="30" height="8" rx="2" fill="#1e1e1e" stroke="#333" stroke-width="0.5"/>
    <rect x="130" y="90" width="55" height="4" rx="1" fill="#333" opacity="0.5"/>
  </g>

  <!-- Open notebook -->
  <g transform="translate(100, 330)" filter="url(#soft-shadow)">
    <path d="M-5,5 L340,0 L345,160 L0,170 Z" fill="#1a1a1a" rx="3"/>
    <path d="M160,8 Q20,10 10,18 L8,155 Q20,150 160,148 Z" fill="url(#page-left)"/>
    <path d="M160,8 Q150,8 145,10 L143,146 Q150,148 160,148 Z" fill="#e8dfc8" opacity="0.5"/>
    <path d="M170,8 Q310,6 325,14 L327,152 Q310,148 170,148 Z" fill="url(#page-right)"/>
    <path d="M170,8 Q180,8 185,8 L185,148 Q178,148 170,148 Z" fill="#fff" opacity="0.06"/>
    <line x1="165" y1="5" x2="165" y2="150" stroke="#c4b896" stroke-width="2"/>
    <g stroke="#c0b89a" stroke-width="0.8" opacity="0.45">
      <line x1="30" y1="35" x2="145" y2="34"/>
      <line x1="30" y1="48" x2="138" y2="47"/>
      <line x1="30" y1="61" x2="148" y2="60"/>
      <line x1="30" y1="74" x2="130" y2="73"/>
      <line x1="30" y1="87" x2="142" y2="86"/>
      <line x1="30" y1="100" x2="125" y2="99"/>
      <line x1="30" y1="113" x2="140" y2="112"/>
      <line x1="30" y1="126" x2="118" y2="125"/>
    </g>
    <g stroke="#c0b89a" stroke-width="0.8" opacity="0.4">
      <line x1="185" y1="33" x2="305" y2="32"/>
      <line x1="185" y1="46" x2="298" y2="45"/>
      <line x1="185" y1="59" x2="310" y2="58"/>
      <line x1="185" y1="72" x2="290" y2="71"/>
      <line x1="185" y1="85" x2="302" y2="84"/>
      <line x1="185" y1="98" x2="285" y2="97"/>
      <line x1="185" y1="111" x2="295" y2="110"/>
    </g>
    <path d="M160,150 L155,175 L165,165 L175,175 L170,150" fill="#1a1a1a" opacity="0.6"/>
    <!-- Pen -->
    <g transform="translate(200, 50) rotate(20, 0, 0)">
      <rect x="0" y="0" width="130" height="7" rx="3.5" fill="#111"/>
      <rect x="0" y="0.5" width="35" height="6" rx="3" fill="#222"/>
      <rect x="110" y="-2" width="25" height="3" rx="1" fill="#1a1a1a"/>
      <rect x="130" y="-3" width="5" height="5" rx="2" fill="#333"/>
      <polygon points="0,1 -8,3.5 0,6" fill="#888"/>
      <polygon points="0,2 -5,3.5 0,5" fill="#aaa"/>
      <rect x="33" y="0" width="4" height="7" rx="0.5" fill="#c9a860"/>
      <rect x="105" y="0" width="3" height="7" rx="0.5" fill="#c9a860"/>
    </g>
  </g>

  <!-- Foreground depth blur -->
  <rect y="490" width="800" height="70" fill="#8c6d3f" opacity="0.3"/>
  <!-- Warm light overlay -->
  <rect width="800" height="560" fill="#f5e6c8" opacity="0.04"/>
</svg>
